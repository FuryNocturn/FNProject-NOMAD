server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # The .wasm and .js files exist only as .gz (see Dockerfile).
  gzip_static always;
  gunzip on;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # nginx drops server-level add_header in any location that sets its own,
  # so the security headers are repeated in each location below.

  # Hashed bundles never change; each app's index.html must be revalidated.
  location ~* \.(wasm|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri $uri/ =404;
  }
}
