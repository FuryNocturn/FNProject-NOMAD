<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOMAD Craft Suite</title>
    <style>
      :root {
        --bg: #f5f3ea;
        --surface: #fff;
        --text: #2b2a20;
        --muted: #6b6955;
        --border: #d3cfb9;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b15;
          --surface: #26261d;
          --text: #ecebdf;
          --muted: #aaa892;
          --border: #45453a;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
      h1 { margin: 0 0 4px; }
      header p { margin: 0 0 20px; color: var(--muted); }
      ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
      a.card { display: flex; flex-direction: column; gap: 6px; height: 100%; padding: 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); color: inherit; text-decoration: none; }
      a.card:hover { box-shadow: 0 6px 18px rgb(0 0 0 / 0.12); }
      .icon { font-size: 2rem; }
      .name { font-weight: 700; font-size: 1.1rem; }
      .like, .ver { color: var(--muted); font-size: 0.85rem; }
      footer { margin-top: 28px; color: var(--muted); font-size: 0.85rem; line-height: 1.5; }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>NOMAD Craft Suite</h1>
        <p data-i18n="sub"></p>
      </header>
      <ul id="tools"></ul>
      <footer data-i18n="foot"></footer>
    </main>
    <script>
      // Text in Spanish or English, following the browser.
      const es = (navigator.language || '').toLowerCase().startsWith('es')
      const T = es
        ? {
            sub: 'Herramientas creativas y de oficina que funcionan en el navegador, sin conexión.',
            foot: 'Apps de código abierto de <a href="https://github.com/storytold">storytold</a> (licencias MIT y Apache-2.0). Tus documentos se guardan en tu equipo: ábrelos y guárdalos con los menús de cada app. Por HTTP en la red local dibujan con WebGL2; con HTTPS o desde el propio equipo usan WebGPU.',
          }
        : {
            sub: 'Creative and office tools that run in the browser, offline.',
            foot: 'Open-source apps by <a href="https://github.com/storytold">storytold</a> (MIT and Apache-2.0 licences). Your documents stay on your device: open and save them from each app\'s menus. Over plain HTTP on the local network they render with WebGL2; over HTTPS or on this machine they use WebGPU.',
          }
      document.documentElement.lang = es ? 'es' : 'en'
      for (const el of document.querySelectorAll('[data-i18n]')) el.innerHTML = T[el.dataset.i18n]

      const TOOLS = {
        photocraft: ['🖼️', 'PhotoCraft', 'Photoshop', 'Edición de imágenes con capas', 'Layered image editing'],
        lightcraft: ['📷', 'LightCraft', 'Lightroom', 'Revelado y biblioteca de fotos', 'Photo developing and library'],
        vectorcraft: ['✒️', 'VectorCraft', 'Illustrator', 'Ilustración vectorial', 'Vector illustration'],
        designcraft: ['📰', 'DesignCraft', 'InDesign', 'Maquetación y publicación', 'Page layout and publishing'],
        figcraft: ['🧩', 'FigCraft', 'Figma', 'Diseño de interfaces', 'Interface design'],
        wordcraft: ['📝', 'WordCraft', 'Word', 'Procesador de textos', 'Word processing'],
        gridcraft: ['📊', 'GridCraft', 'Excel', 'Hojas de cálculo', 'Spreadsheets'],
        deckcraft: ['📽️', 'DeckCraft', 'PowerPoint', 'Presentaciones', 'Presentations'],
        pdfcraft: ['📄', 'PDFCraft', 'Acrobat', 'Leer, anotar y editar PDF', 'Read, annotate and edit PDFs'],
        filmcraft: ['🎬', 'FilmCraft', 'Premiere Pro', 'Edición de vídeo', 'Video editing'],
        effectcraft: ['✨', 'EffectCraft', 'After Effects', 'Animación y efectos', 'Motion graphics and effects'],
        soundcraft: ['🎚️', 'SoundCraft', 'Pro Tools', 'Grabación y mezcla de audio', 'Audio recording and mixing'],
        cadcraft: ['📐', 'CADCraft', 'AutoCAD', 'Dibujo técnico (CAD)', 'Technical drawing (CAD)'],
      }

      fetch('crafts.json')
        .then((r) => r.json())
        .catch(() => [])
        .then((list) => {
          const versions = Object.fromEntries(list.map((c) => [c.name, c.version]))
          const ul = document.getElementById('tools')
          for (const [id, [icon, name, like, descEs, descEn]] of Object.entries(TOOLS)) {
            const li = document.createElement('li')
            li.innerHTML = `<a class="card" href="./${id}/"><span class="icon"></span><span class="name"></span><span class="desc"></span><span class="like"></span><span class="ver"></span></a>`
            li.querySelector('.icon').textContent = icon
            li.querySelector('.name').textContent = name
            li.querySelector('.desc').textContent = es ? descEs : descEn
            li.querySelector('.like').textContent = (es ? 'Como ' : 'Like ') + like
            li.querySelector('.ver').textContent = versions[id] ? 'v' + versions[id] : ''
            ul.append(li)
          }
        })
    </script>
  </body>
</html>
