server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/plain;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # nginx drops server-level add_header in any location that sets its own,
  # so the security headers are repeated in each location below.

  # Hashed bundles never change; index.html must be revalidated to pick up a new build.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    try_files $uri $uri/ /index.html;
  }
}
